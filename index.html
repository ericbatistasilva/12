<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rio de Janeiro 3D - Motor Customizado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .ui-panel { position: absolute; background: rgba(0,0,0,0.7); color: #fff; padding: 12px 16px; border-radius: 8px; pointer-events: auto; backdrop-filter: blur(4px); }
        #fps-counter { top: 15px; left: 15px; font-size: 14px; font-weight: bold; color: #0f0; }
        #controls-help { top: 15px; right: 15px; font-size: 11px; line-height: 1.6; max-width: 220px; }
        #view-buttons { bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
        .view-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px; }
        .view-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        #minimap-container { bottom: 20px; right: 20px; width: 150px; height: 150px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; overflow: hidden; background: rgba(0,0,0,0.5); }
        #minimap { width: 100%; height: 100%; }
        #tooltip { position: absolute; background: rgba(0,0,0,0.85); color: #ffd700; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity 0.2s; border: 1px solid rgba(255,215,0,0.3); z-index: 1000; }
        #pause-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: #fff; padding: 30px 50px; border-radius: 15px; font-size: 24px; font-weight: bold; display: none; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="ui-layer">
        <div id="fps-counter" class="ui-panel">FPS: 0</div>
        <div id="controls-help" class="ui-panel"><strong>CONTROLES:</strong><br>🖱️ Arrastar: Rotacionar<br>🔍 Scroll: Zoom<br>⌨️ W/S: Avançar/Recuar<br>⌨️ A/D: Girar<br>⌨️ Q/E: Subir/Descer<br>⌨️ R: Resetar<br>⌨️ Espaço: Pausar</div>
        <div id="view-buttons" class="ui-panel">
            <button class="view-btn" onclick="setView('aerea')">🛩️ Vista Aérea</button>
            <button class="view-btn" onclick="setView('cristo')">✝️ Vista Cristo</button>
            <button class="view-btn" onclick="setView('baia')">🌊 Vista Baía</button>
        </div>
        <div id="minimap-container" class="ui-panel"><canvas id="minimap"></canvas></div>
    </div>
    <div id="tooltip"></div>
    <div id="pause-overlay">⏸️ PAUSADO</div>
<script>
class Vec3 {
    constructor(x = 0, y = 0, z = 0) { this.x = x; this.y = y; this.z = z; }
    add(v) { return new Vec3(this.x + v.x, this.y + v.y, this.z + v.z); }
    sub(v) { return new Vec3(this.x - v.x, this.y - v.y, this.z - v.z); }
    scale(s) { return new Vec3(this.x * s, this.y * s, this.z * s); }
    dot(v) { return this.x * v.x + this.y * v.y + this.z * v.z; }
    cross(v) { return new Vec3(this.y * v.z - this.z * v.y, this.z * v.x - this.x * v.z, this.x * v.y - this.y * v.x); }
    normalize() { const len = Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z); if (len < 0.0001) return new Vec3(0, 0, 0); return new Vec3(this.x / len, this.y / len, this.z / len); }
}

class Mat4 {
    constructor() { this.data = new Float32Array(16); this.identity(); }
    identity() { this.data.fill(0); this.data[0] = this.data[5] = this.data[10] = this.data[15] = 1; return this; }
    static perspective(fov, aspect, near, far) {
        const m = new Mat4(), f = 1.0 / Math.tan(fov / 2), nf = 1 / (near - far);
        m.data[0] = f / aspect; m.data[5] = f; m.data[10] = (far + near) * nf; m.data[11] = -1; m.data[14] = 2 * far * near * nf;
        return m;
    }
    static lookAt(eye, target, up) {
        const m = new Mat4(), z = eye.sub(target).normalize(), x = up.cross(z).normalize(), y = z.cross(x).normalize();
        m.data[0] = x.x; m.data[1] = x.y; m.data[2] = x.z; m.data[4] = y.x; m.data[5] = y.y; m.data[6] = y.z; m.data[8] = z.x; m.data[9] = z.y; m.data[10] = z.z;
        m.data[12] = -x.dot(eye); m.data[13] = -y.dot(eye); m.data[14] = -z.dot(eye);
        return m;
    }
    transformPoint(p) {
        const w = this.data[3] * p.x + this.data[7] * p.y + this.data[11] * p.z + this.data[15];
        return new Vec3((this.data[0] * p.x + this.data[4] * p.y + this.data[8] * p.z + this.data[12]) / w, (this.data[1] * p.x + this.data[5] * p.y + this.data[9] * p.z + this.data[13]) / w, (this.data[2] * p.x + this.data[6] * p.y + this.data[10] * p.z + this.data[14]) / w);
    }
}

class Face {
    constructor(vertices, baseColor) { this.vertices = vertices; this.baseColor = baseColor; this.normal = this.computeNormal(); }
    computeNormal() { if (this.vertices.length < 3) return new Vec3(0, 1, 0); const a = this.vertices[0], b = this.vertices[1], c = this.vertices[2]; return b.sub(a).cross(c.sub(a)).normalize(); }
}

class Mesh {
    constructor(faces, position = new Vec3()) { this.faces = faces; this.position = position; this.name = ""; }
    getProjectedFaces(camera, cw, ch) {
        const vm = camera.getViewMatrix(), pm = camera.getProjectionMatrix(cw / ch), result = [];
        for (const face of this.faces) {
            const tv = face.vertices.map(v => v.add(this.position));
            const pv = tv.map(v => { const vp = vm.transformPoint(v); if (vp.z < 0.1) return null; const pp = pm.transformPoint(vp); return { x: (pp.x + 1) * 0.5 * cw, y: (1 - pp.y) * 0.5 * ch, z: vp.z }; });
            if (pv.some(v => v === null)) continue;
            result.push({ vertices: pv, baseColor: face.baseColor, normal: face.normal, depth: pv.reduce((s, v) => s + v.z, 0) / pv.length });
        }
        return result;
    }
}

class Camera {
    constructor() { this.position = new Vec3(0, 60, 0); this.target = new Vec3(0, 14, 0); this.up = new Vec3(0, 1, 0); this.fov = Math.PI / 3; this.near = 0.1; this.far = 1000; this.yaw = 0; this.pitch = -Math.PI / 4; this.distance = 50; this.update(); }
    update() { this.position.x = this.target.x + this.distance * Math.cos(this.pitch) * Math.sin(this.yaw); this.position.z = this.target.z + this.distance * Math.cos(this.pitch) * Math.cos(this.yaw); this.position.y = this.target.y + this.distance * Math.sin(this.pitch); }
    getViewMatrix() { return Mat4.lookAt(this.position, this.target, this.up); }
    getProjectionMatrix(aspect) { return Mat4.perspective(this.fov, aspect, this.near, this.far); }
    rotate(dx, dy) { this.yaw -= dx * 0.005; this.pitch = Math.max(-1.37, Math.min(1.37, this.pitch + dy * 0.005)); this.update(); }
    zoom(d) { this.distance = Math.max(5, Math.min(200, this.distance * (1 - d * 0.001))); this.update(); }
    reset() { this.target = new Vec3(0, 14, 0); this.yaw = 0; this.pitch = -Math.PI / 4; this.distance = 50; this.update(); }
}

const parseColor = hex => ({ r: parseInt(hex.slice(1, 3), 16), g: parseInt(hex.slice(3, 5), 16), b: parseInt(hex.slice(5, 7), 16) });
const applyLighting = (c, n, l) => { const i = 0.35 + 0.65 * Math.max(0, n.dot(l)); return { r: Math.min(255, c.r * i + 25), g: Math.min(255, c.g * i), b: Math.min(255, Math.max(0, c.b * i - 10)) }; };
const applyFog = (c, d) => { const f = Math.max(0, Math.min(1, (d - 50) / 150)); return { r: c.r * (1 - f) + 200 * f, g: c.g * (1 - f) + 210 * f, b: c.b * (1 - f) + 220 * f }; };
const colorToCSS = (r, g, b, a = 1) => `rgba(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}, ${a})`;

function createScene() {
    const meshes = [], ld = new Vec3(1, 0.6, 0.3).normalize();
    
    // CRISTO REDENTOR
    const cf = [], cc = { r: 235, g: 230, b: 215 }, bv = [new Vec3(-0.8, 0, -0.5), new Vec3(0.8, 0, -0.5), new Vec3(0.8, 0, 0.5), new Vec3(-0.8, 0, 0.5), new Vec3(-0.4, 5, -0.3), new Vec3(0.4, 5, -0.3), new Vec3(0.4, 5, 0.3), new Vec3(-0.4, 5, 0.3)];
    cf.push(new Face([bv[0], bv[1], bv[5], bv[4]], cc), new Face([bv[1], bv[2], bv[6], bv[5]], cc), new Face([bv[2], bv[3], bv[7], bv[6]], cc), new Face([bv[3], bv[0], bv[4], bv[7]], cc), new Face([bv[4], bv[5], bv[6], bv[7]], cc));
    const ac = { r: 230, g: 225, b: 210 };
    cf.push(new Face([new Vec3(-0.4, 4, 0), new Vec3(-3, 4.5, -0.3), new Vec3(-3, 4, -0.3), new Vec3(-0.4, 3.5, 0)], ac), new Face([new Vec3(-0.4, 4, 0), new Vec3(-3, 4.5, 0.3), new Vec3(-3, 4, 0.3), new Vec3(-0.4, 3.5, 0)], ac), new Face([new Vec3(-3, 4.5, -0.3), new Vec3(-3, 4.5, 0.3), new Vec3(-3, 4, 0.3), new Vec3(-3, 4, -0.3)], ac));
    cf.push(new Face([new Vec3(0.4, 4, 0), new Vec3(3, 4.5, -0.3), new Vec3(3, 4, -0.3), new Vec3(0.4, 3.5, 0)], ac), new Face([new Vec3(0.4, 4, 0), new Vec3(3, 4.5, 0.3), new Vec3(3, 4, 0.3), new Vec3(0.4, 3.5, 0)], ac), new Face([new Vec3(3, 4.5, -0.3), new Vec3(3, 4.5, 0.3), new Vec3(3, 4, 0.3), new Vec3(3, 4, -0.3)], ac));
    const hc = { r: 240, g: 235, b: 220 };
    cf.push(new Face([new Vec3(-0.3, 5, -0.2), new Vec3(0.3, 5, -0.2), new Vec3(0.3, 5.8, -0.2), new Vec3(-0.3, 5.8, -0.2)], hc), new Face([new Vec3(0.3, 5, -0.2), new Vec3(0.3, 5, 0.2), new Vec3(0.3, 5.8, 0.2), new Vec3(0.3, 5.8, -0.2)], hc), new Face([new Vec3(0.3, 5, 0.2), new Vec3(-0.3, 5, 0.2), new Vec3(-0.3, 5.8, 0.2), new Vec3(0.3, 5.8, 0.2)], hc), new Face([new Vec3(-0.3, 5, 0.2), new Vec3(-0.3, 5, -0.2), new Vec3(-0.3, 5.8, -0.2), new Vec3(-0.3, 5.8, 0.2)], hc), new Face([new Vec3(-0.3, 5.8, -0.2), new Vec3(0.3, 5.8, -0.2), new Vec3(0.3, 5.8, 0.2), new Vec3(-0.3, 5.8, 0.2)], hc));
    const pc = { r: 100, g: 90, b: 80 };
    cf.push(new Face([new Vec3(-1.5, 0, -1.5), new Vec3(1.5, 0, -1.5), new Vec3(1.5, 0, 1.5), new Vec3(-1.5, 0, 1.5)], pc), new Face([new Vec3(-1.5, 0, -1.5), new Vec3(1.5, 0, -1.5), new Vec3(1, 3, -1), new Vec3(-1, 3, -1)], pc), new Face([new Vec3(1.5, 0, -1.5), new Vec3(1.5, 0, 1.5), new Vec3(1, 3, 1), new Vec3(1, 3, -1)], pc), new Face([new Vec3(1.5, 0, 1.5), new Vec3(-1.5, 0, 1.5), new Vec3(-1, 3, 1), new Vec3(1, 3, 1)], pc), new Face([new Vec3(-1.5, 0, 1.5), new Vec3(-1.5, 0, -1.5), new Vec3(-1, 3, -1), new Vec3(-1, 3, 1)], pc));
    const cm = new Mesh(cf, new Vec3(0, 14, 0)); cm.name = "Cristo Redentor"; meshes.push(cm);

    // CORCOVADO
    const corf = [], greens = ['#2d5a27', '#3a6b32', '#4a7c59', '#2e5530', '#3d6b40'], peak = new Vec3(0, 0, 0), bp = [];
    for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2, r = 15 + Math.random() * 5; bp.push(new Vec3(Math.cos(a) * r, -14, Math.sin(a) * r)); }
    for (let i = 0; i < 12; i++) { const col = parseColor(greens[i % 5]), adj = applyLighting(col, new Vec3(Math.cos((i + 0.5) / 12 * Math.PI * 2), 0.3, Math.sin((i + 0.5) / 12 * Math.PI * 2)).normalize(), ld); corf.push(new Face([peak, bp[(i + 1) % 12], bp[i]], adj)); }
    const corm = new Mesh(corf, new Vec3(0, 0, 0)); corm.name = "Corcovado"; meshes.push(corm);

    // LAGOA
    const lf = [], lc = parseColor('#3a7ca5'), lp = [];
    for (let i = 0; i < 20; i++) { const a = (i / 20) * Math.PI * 2, rx = 12 + Math.sin(a * 3) * 2, rz = 6 + Math.cos(a * 2) * 1.5; lp.push(new Vec3(-18 + Math.cos(a) * rx, -1, 8 + Math.sin(a) * rz)); }
    const lct = new Vec3(-18, -1.1, 8);
    for (let i = 0; i < 20; i++) lf.push(new Face([lct, lp[i], lp[(i + 1) % 20]], lc));
    const lm = new Mesh(lf, new Vec3(0, 0, 0)); lm.name = "Lagoa"; meshes.push(lm);

    // PÃO DE AÇÚCAR
    const pf = [], pac = parseColor('#6b5a3e'), ppk = new Vec3(22, 5, -10), pbp = [];
    for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2, r = 6 + Math.sin(a * 4); pbp.push(new Vec3(22 + Math.cos(a) * r, -5, -10 + Math.sin(a) * r)); }
    for (let i = 0; i < 16; i++) { const n = new Vec3(Math.cos((i + 0.5) / 16 * Math.PI * 2), 0.5, Math.sin((i + 0.5) / 16 * Math.PI * 2)).normalize(); pf.push(new Face([ppk, pbp[(i + 1) % 16], pbp[i]], applyLighting(pac, n, ld))); }
    const pm = new Mesh(pf, new Vec3(0, 0, 0)); pm.name = "Pão de Açúcar"; meshes.push(pm);

    // BAÍA
    const bf = [], bac = parseColor('#4a90c4');
    for (let i = 0; i < 7; i++) for (let j = 0; j < 5; j++) { const cv = 10 + Math.sin(i * 0.5 + j * 0.3) * 5; bf.push(new Face([new Vec3(-40 + i * 10, -2, -80 + j * 10), new Vec3(-30 + i * 10, -2, -80 + j * 10), new Vec3(-30 + i * 10, -2, -70 + j * 10), new Vec3(-40 + i * 10, -2, -70 + j * 10)], { r: bac.r + cv, g: bac.g + cv, b: bac.b })); }
    const bm = new Mesh(bf, new Vec3(0, 0, 0)); bm.name = "Baía"; meshes.push(bm);

    // ILHAS
    [[-25, -1.5, -50], [15, -1.5, -55], [-10, -1.5, -65], [30, -1.5, -45]].forEach(([x, y, z]) => { const sz = 2 + Math.random() * 2, ic = parseColor('#5a6b4e'), mf = []; mf.push(new Face([new Vec3(-sz, 0, -sz), new Vec3(sz, 0, -sz), new Vec3(sz, 0, sz), new Vec3(-sz, 0, sz)], ic)); meshes.push(new Mesh(mf, new Vec3(x, y, z))); });

    // BARCOS
    const boats = []; for (let i = 0; i < 8; i++) boats.push({ pos: new Vec3(-30 + Math.random() * 60, -1.8, -70 + Math.random() * 40), dir: new Vec3(Math.random() - 0.5, 0, 0.1 + Math.random() * 0.2).normalize(), spd: 0.02 + Math.random() * 0.02 });

    // PRÉDIOS
    const bcols = [parseColor('#f5f5f5'), parseColor('#e0e0e0'), parseColor('#d4c4b0'), parseColor('#c0c0c0'), parseColor('#f0ebe0')];
    [[-10, 5, 25, 4], [-25, 10, 20, 5]].forEach(([xs, zs, xr, zh]) => { for (let i = 0; i < 150; i++) { const x = xs + Math.random() * xr, z = zs + Math.random() * 15, h = 1 + Math.random() * zh, w = 0.7 + Math.random() * 0.5, d = 0.7 + Math.random() * 0.5, c = bcols[Math.floor(Math.random() * 5)], f = []; f.push(new Face([new Vec3(-w/2, 0, -d/2), new Vec3(w/2, 0, -d/2), new Vec3(w/2, h, -d/2), new Vec3(-w/2, h, -d/2)], c), new Face([new Vec3(w/2, 0, d/2), new Vec3(-w/2, 0, d/2), new Vec3(-w/2, h, d/2), new Vec3(w/2, h, d/2)], c), new Face([new Vec3(-w/2, 0, d/2), new Vec3(-w/2, 0, -d/2), new Vec3(-w/2, h, -d/2), new Vec3(-w/2, h, d/2)], c), new Face([new Vec3(w/2, 0, -d/2), new Vec3(w/2, 0, d/2), new Vec3(w/2, h, d/2), new Vec3(w/2, h, -d/2)], c), new Face([new Vec3(-w/2, h, -d/2), new Vec3(w/2, h, -d/2), new Vec3(w/2, h, d/2), new Vec3(-w/2, h, d/2)], { r: c.r - 10, g: c.g - 10, b: c.b - 10 })); meshes.push(new Mesh(f, new Vec3(x, 0, z))); } });

    // VEGETAÇÃO
    const vcols = [parseColor('#2d5a27'), parseColor('#4a7c59'), parseColor('#3a6b32')];
    for (let i = 0; i < 200; i++) { const a = Math.random() * Math.PI * 2, d = 5 + Math.random() * 12, x = Math.cos(a) * d, z = Math.sin(a) * d, y = -2 + Math.random() * 3; if (Math.abs(x) > 3 || y > 2) { const vc = vcols[Math.floor(Math.random() * 3)], sz = 0.5 + Math.random() * 1.5, vf = []; for (let j = 0; j < 4; j++) { const aa = (j / 4) * Math.PI * 2; vf.push(new Face([new Vec3(0, 0, 0), new Vec3(Math.cos(aa) * sz, sz * 0.5, Math.sin(aa) * sz), new Vec3(Math.cos(aa + Math.PI/4) * sz, sz * 0.5, Math.sin(aa + Math.PI/4) * sz)], vc)); } meshes.push(new Mesh(vf, new Vec3(x, y, z))); } }

    return { meshes, boats };
}

class Renderer {
    constructor() {
        this.canvas = document.getElementById('canvas'); this.ctx = this.canvas.getContext('2d'); this.mmCanvas = document.getElementById('minimap'); this.mmCtx = this.mmCanvas.getContext('2d');
        this.camera = new Camera(); this.scene = createScene(); this.paused = false; this.lastTime = performance.now(); this.fc = 0; this.fps = 0; this.fpsT = 0;
        this.setupControls(); this.resize(); window.addEventListener('resize', () => this.resize()); this.animate();
    }
    resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; this.mmCanvas.width = 150; this.mmCanvas.height = 150; }
    setupControls() {
        let dragging = false, lx = 0, ly = 0;
        this.canvas.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
        window.addEventListener('mouseup', () => dragging = false);
        window.addEventListener('mousemove', e => { if (dragging) { this.camera.rotate(e.clientX - lx, e.clientY - ly); lx = e.clientX; ly = e.clientY; } this.checkHover(e.clientX, e.clientY); });
        this.canvas.addEventListener('wheel', e => { e.preventDefault(); this.camera.zoom(e.deltaY); });
        window.addEventListener('keydown', e => { switch(e.key.toLowerCase()) { case 'w': const fw = this.camera.target.sub(this.camera.position).normalize(); this.camera.position = this.camera.position.add(fw.scale(2)); this.camera.target = this.camera.target.add(fw.scale(2)); break; case 's': const bw = this.camera.position.sub(this.camera.target).normalize(); this.camera.position = this.camera.position.add(bw.scale(2)); this.camera.target = this.camera.target.add(bw.scale(2)); break; case 'a': this.camera.yaw += 0.05; this.camera.update(); break; case 'd': this.camera.yaw -= 0.05; this.camera.update(); break; case 'q': this.camera.position.y += 2; this.camera.target.y += 2; break; case 'e': this.camera.position.y -= 2; this.camera.target.y -= 2; break; case 'r': this.camera.reset(); break; case ' ': this.paused = !this.paused; document.getElementById('pause-overlay').style.display = this.paused ? 'block' : 'none'; break; } });
    }
    checkHover(mx, my) {
        const tt = document.getElementById('tooltip'), cx = this.canvas.width / 2, cy = this.canvas.height / 2, d = Math.sqrt((mx - cx) ** 2 + (my - cy) ** 2);
        if (d < 100 && this.camera.distance < 80) { tt.style.left = mx + 15 + 'px'; tt.style.top = my + 15 + 'px'; tt.textContent = 'Cristo Redentor'; tt.style.opacity = 1; } else if (mx < cx - 100 && my > cy && this.camera.distance < 100) { tt.style.left = mx + 15 + 'px'; tt.style.top = my + 15 + 'px'; tt.textContent = 'Lagoa Rodrigo de Freitas'; tt.style.opacity = 1; } else if (mx > cx + 100 && this.camera.distance < 100) { tt.style.left = mx + 15 + 'px'; tt.style.top = my + 15 + 'px'; tt.textContent = 'Pão de Açúcar'; tt.style.opacity = 1; } else tt.style.opacity = 0;
    }
    drawSky() { const g = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height); g.addColorStop(0, '#87CEEB'); g.addColorStop(0.6, '#B8D4E8'); g.addColorStop(1, '#FFD580'); this.ctx.fillStyle = g; this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height); this.ctx.fillStyle = 'rgba(255,255,255,0.7)'; [{x:100,y:80,w:120,h:40},{x:400,y:120,w:150,h:50},{x:700,y:60,w:100,h:35},{x:900,y:100,w:130,h:45},{x:1200,y:90,w:110,h:38}].forEach(c => { this.ctx.beginPath(); this.ctx.ellipse(c.x, c.y, c.w, c.h, 0, 0, Math.PI * 2); this.ctx.fill(); }); }
    render() {
        const t = performance.now(); this.fc++; if (t - this.fpsT >= 1000) { this.fps = this.fc; this.fc = 0; this.fpsT = t; document.getElementById('fps-counter').textContent = `FPS: ${this.fps}`; }
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); this.drawSky();
        if (!this.paused) this.scene.boats.forEach(b => { b.pos.x += b.dir.x * b.spd; b.pos.z += b.dir.z * b.spd; if (b.pos.x < -35 || b.pos.x > 35) b.dir.x *= -1; if (b.pos.z < -75 || b.pos.z > -25) b.dir.z *= -1; });
        const af = [], la = 0.7 + Math.sin(t * 0.002) * 0.15;
        this.scene.meshes.forEach(m => m.getProjectedFaces(this.camera, this.canvas.width, this.canvas.height).forEach(f => { const lc = applyLighting(f.baseColor, f.normal, new Vec3(1, 0.6, 0.3).normalize()), fc = applyFog(lc, f.depth); af.push({ vertices: f.vertices, color: fc, depth: f.depth, alpha: m.name.includes('Lagoa') ? la : 1 }); }));
        this.scene.boats.forEach(b => { const vp = this.camera.getViewMatrix().transformPoint(b.pos); if (vp.z > 0.1) { const pp = this.camera.getProjectionMatrix(this.canvas.width / this.canvas.height).transformPoint(vp), sx = (pp.x + 1) * 0.5 * this.canvas.width, sy = (1 - pp.y) * 0.5 * this.canvas.height; this.ctx.fillStyle = '#fff'; this.ctx.beginPath(); this.ctx.moveTo(sx, sy - 3); this.ctx.lineTo(sx - 2, sy + 2); this.ctx.lineTo(sx + 2, sy + 2); this.ctx.closePath(); this.ctx.fill(); } });
        af.sort((a, b) => b.depth - a.depth);
        af.forEach(f => { if (f.vertices.length < 3) return; this.ctx.fillStyle = colorToCSS(f.color.r, f.color.g, f.color.b, f.alpha); this.ctx.strokeStyle = colorToCSS(f.color.r * 0.7, f.color.g * 0.7, f.color.b * 0.7, f.alpha); this.ctx.lineWidth = 0.5; this.ctx.beginPath(); this.ctx.moveTo(f.vertices[0].x, f.vertices[0].y); for (let i = 1; i < f.vertices.length; i++) this.ctx.lineTo(f.vertices[i].x, f.vertices[i].y); this.ctx.closePath(); this.ctx.fill(); this.ctx.stroke(); });
        this.drawMinimap();
    }
    drawMinimap() { const ctx = this.mmCtx, cx = 75, cy = 75; ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, 0, 150, 150); ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#3a7ca5'; ctx.beginPath(); ctx.ellipse(cx - 36, cy + 16, 24, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#4a90c4'; ctx.fillRect(cx - 80, cy - 160, 160, 60); ctx.fillStyle = '#6b5a3e'; ctx.beginPath(); ctx.arc(cx + 44, cy - 20, 8, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#f00'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx + (this.camera.position.x - this.camera.target.x) * 2, cy + (this.camera.position.z - this.camera.target.z) * 2); ctx.lineTo(cx, cy); ctx.stroke(); ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(cx + (this.camera.position.x - this.camera.target.x) * 2, cy + (this.camera.position.z - this.camera.target.z) * 2, 3, 0, Math.PI * 2); ctx.fill(); }
    animate() { this.render(); requestAnimationFrame(() => this.animate()); }
}

let renderer; function setView(v) { if (!renderer) return; switch(v) { case 'aerea': renderer.camera.target = new Vec3(0, 14, 0); renderer.camera.yaw = 0; renderer.camera.pitch = -1.26; renderer.camera.distance = 80; renderer.camera.update(); break; case 'cristo': renderer.camera.target = new Vec3(0, 20, 5); renderer.camera.yaw = Math.PI; renderer.camera.pitch = -0.3; renderer.camera.distance = 25; renderer.camera.update(); break; case 'baia': renderer.camera.target = new Vec3(0, 10, -30); renderer.camera.yaw = 0; renderer.camera.pitch = -0.2; renderer.camera.distance = 60; renderer.camera.update(); break; } }
window.onload = () => { renderer = new Renderer(); };
</script>
